services:
  - type: web
    name: airi-sensei-bot
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: AI_BASE_URL
        value: https://api.b.ai/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_PRIMARY_MODEL
        value: deepseek-v4.1-flash
      - key: AI_FALLBACK_MODELS
        value: qwen3.8-flash,glm-5.3-flash,minimax-m3.1-flash
      - key: IMAGE_MODEL
        value: flux
      - key: IMAGE_FALLBACK_MODEL
        value: turbo
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
