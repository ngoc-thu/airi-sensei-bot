services:
  - type: web
    name: airi-sensei-bot
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_PASSCODE
        value: "airi2026"
      - key: ALLOWED_USER_IDS
        sync: false
      - key: AI_BASE_URL
        value: https://api.b.ai/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_PRIMARY_MODEL
        value: deepseek-v4.1-flash
      - key: AI_FALLBACK_MODELS
        value: qwen3.8-flash,glm-5.3-flash,minimax-m3.1-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_FREE_MODELS
        value: google/gemma-4-31b-it:free,nvidia/nemotron-3.5-lightning:free,google/gemma-4-26b-a4b-it:free
      - key: IMAGE_MODEL
        value: flux
      - key: IMAGE_FALLBACK_MODEL
        value: turbo
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
