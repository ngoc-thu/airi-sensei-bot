services:
  - type: web
    name: airi-sensei-bot
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    disk:
      name: airi-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # OpenClaw Core Configuration
      - key: OPENCLAW_CONFIG_PATH
        value: /data/.openclaw/openclaw.json
      - key: OPENCLAW_WORKSPACE
        value: /data/workspace
      - key: OPENCLAW_HOME
        value: /data/.openclaw
      - key: OPENCLAW_GATEWAY_TOKEN
        sync: false

      # Telegram Channel Driver
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        value: "5556841083"

      # Multi-Tier LLM Providers
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1

      # Image Generation Engine
      - key: IMAGE_MODEL
        value: flux
      - key: IMAGE_FALLBACK_MODEL
        value: turbo

      # Server Configuration
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
